packages:
  - fixtures/*
  - test/e2e
  - playground

allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  lefthook: true
  unrs-resolver: false
  vue-demi: false

catalogs:
  default:
    "@nuxt/schema": ^4.5.1
    "@nuxt/kit": ^4.5.1
    nuxt: ^4.5.1
  drivers:
    "@electric-sql/pglite": ^0.5.1
    better-sqlite3: ^12.10.0
    mysql2: ^3.22.4
    postgres: ^3.4.9

onlyBuiltDependencies:
  - better-sqlite3

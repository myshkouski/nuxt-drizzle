packages:
  - fixtures/*
  - test/e2e
  - playground

allowBuilds:
  "@parcel/watcher": false
  better-sqlite3: true
  esbuild: false
  lefthook: true
  unrs-resolver: false
  vue-demi: false

catalogs:
  default:
    "@nuxt/kit": ^4.5.2
    "@nuxt/schema": ^4.5.2
    nitro-drizzle: 0.3.0-beta.5
    nuxt: ^4.5.2
  drivers:
    "@electric-sql/pglite": ^0.5.1
    better-sqlite3: ^12.10.0
    mysql2: ^3.22.4
    postgres: ^3.4.9

minimumReleaseAgeExclude:
  - "@nuxt/kit@4.5.2"
  - "@nuxt/nitro-server@4.5.2"
  - "@nuxt/schema@4.5.2"
  - "@nuxt/vite-builder@4.5.2"
  - nuxt@4.5.2
  - nitro-drizzle@0.3.0-beta.5
  - esbuild@0.24.3 || 0.28.1

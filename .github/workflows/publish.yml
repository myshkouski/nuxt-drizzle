name: Test and publish package

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  id-token: write # Required for OIDC
  contents: write # for semantic-versioning

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare packages
        run: pnpm -w dev:prepare

      - name: Prepare packages
        run: pnpm -r dev:prepare

      - name: Lint code
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare packages
        run: pnpm -w dev:prepare

      - name: Build module
        run: pnpm -w prepack

      - name: Publish
        run: pnpm publish --no-git-checks --provenance --tag latest
